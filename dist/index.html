<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1e6fff">
<title>个税模拟器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { height:100%; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f5f6fa; }
  .wrap { min-height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:32px 24px; }
  .logo { width:84px; height:84px; border-radius:20px; background:linear-gradient(135deg,#1e6fff,#4f90f3); display:flex; align-items:center; justify-content:center; font-size:40px; color:#fff; margin-bottom:14px; box-shadow:0 8px 24px #1e6fff33; }
  h1 { font-size:20px; color:#222; font-weight:600; margin-bottom:6px; }
  .sub { color:#888; font-size:13px; margin-bottom:36px; }
  .card { width:100%; max-width:420px; background:#fff; border-radius:16px; padding:22px 20px; margin-bottom:14px; box-shadow:0 2px 10px #0000000d; cursor:pointer; border:1px solid transparent; transition:transform .15s; display:flex; align-items:center; gap:14px; }
  .card:active { transform:scale(.98); }
  .card .ic { width:48px; height:48px; border-radius:12px; flex:none; display:flex; align-items:center; justify-content:center; font-size:24px; color:#fff; }
  .c1 .ic { background:linear-gradient(135deg,#1e6fff,#4f90f3); }
  .c2 .ic { background:linear-gradient(135deg,#00b578,#0ac282); }
  .card b { display:block; font-size:16px; color:#222; margin-bottom:3px; }
  .card small { color:#999; font-size:12px; line-height:1.5; display:block; }
  .foot { margin-top:26px; color:#bbb; font-size:11px; text-align:center; line-height:1.7; }
  .last { color:#1e6fff; }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">🧾</div>
  <h1>个税模拟器</h1>
  <div class="sub">选择要进入的平台</div>

  <div class="card c1" onclick="go('old')">
    <div class="ic">🏛️</div>
    <div>
      <b>经典版 <span class="last" id="mark-old"></span></b>
      <small>175.24.180.44 · 卡密登录 · 模拟器试用</small>
    </div>
  </div>

  <div class="card c2" onclick="go('new')">
    <div class="ic">📱</div>
    <div>
      <b>新版 Pro <span class="last" id="mark-new"></span></b>
      <small>getjob68.club · 渠道版 · 纳税记录演示</small>
    </div>
  </div>

  <div class="foot">本壳不含任何水印与验证逻辑<br>长按图标可返回此页 · 首页可切换平台</div>
</div>
<script>
  var URLS = {
    old: 'http://175.24.180.44:8080/',
    new: 'https://getjob68.club/mine.html?in_app=1'
  };
  var last = null;
  try { last = localStorage.getItem('tax_last'); } catch(e) {}
  if (last && URLS[last]) {
    document.getElementById('mark-' + last).textContent = '· 上次使用';
  }
  function go(k) {
    try { localStorage.setItem('tax_last', k); } catch(e) {}
    window.location.href = URLS[k];
  }
</script>
</body>
</html>
