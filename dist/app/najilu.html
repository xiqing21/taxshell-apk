<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>纳税记录开具 · 个人所得税</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { min-height:100%; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f5f6fa; color:#222; }
.header { background:#fff; display:flex; align-items:center; height:48px; padding:0 12px; border-bottom:1px solid #f0f0f0; position:sticky; top:0; z-index:5; }
.header .back { color:#4285f4; font-size:15px; text-decoration:none; }
.header .title { flex:1; text-align:center; font-size:17px; font-weight:600; margin-right:40px; }
.content { padding:14px; padding-bottom:40px; }
.card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 6px #0000000a; }
.card h3 { font-size:15px; margin-bottom:14px; display:flex; align-items:center; gap:6px; }
.card h3::before { content:''; width:4px; height:16px; background:#1e6fff; border-radius:2px; }
.field { display:flex; align-items:center; min-height:48px; border-bottom:1px solid #f5f5f5; }
.field:last-of-type { border-bottom:0; }
.field label { width:90px; font-size:14px; color:#666; flex:none; }
.field input, .field select { flex:1; border:0; outline:0; font-size:15px; text-align:right; background:transparent; color:#222; }
.field .chev { color:#c8c8c8; margin-left:6px; }
.range-row { display:flex; gap:10px; margin-top:10px; }
.range-box { flex:1; border:1px solid #e3e6ec; border-radius:10px; padding:10px 12px; text-align:center; }
.range-box small { display:block; color:#999; font-size:11px; margin-bottom:3px; }
.range-box b { font-size:16px; }
.btn-primary { display:block; width:100%; height:46px; border:0; border-radius:23px; background:#1e6fff; color:#fff; font-size:16px; font-weight:500; margin-top:16px; }
.btn-primary:disabled { background:#b9cdf5; }
.slider-box { margin-top:14px; background:#f7f8fa; border-radius:22px; height:44px; position:relative; overflow:hidden; }
.slider-track { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#999; font-size:13px; }
.slider-handle { position:absolute; left:2px; top:2px; width:56px; height:40px; background:#fff; border-radius:20px; box-shadow:0 1px 4px #00000022; display:flex; align-items:center; justify-content:center; color:#1e6fff; font-size:18px; cursor:grab; z-index:2; }
.slider-box.verified { background:#e8f8f0; }
.slider-box.verified .slider-track { color:#0a8f56; }
.app-item { background:#fff; border-radius:12px; padding:14px; margin-bottom:10px; box-shadow:0 1px 6px #0000000a; }
.app-line { display:flex; justify-content:space-between; font-size:13px; color:#666; line-height:2; }
.app-line b { color:#222; font-weight:500; }
.app-status { color:#0a8f56; }
.app-actions { display:flex; gap:10px; margin-top:8px; }
.app-actions button { flex:1; height:36px; border-radius:18px; border:1px solid #1e6fff; background:#fff; color:#1e6fff; font-size:14px; }
.app-actions button.save { background:#1e6fff; color:#fff; }
.empty { text-align:center; color:#999; font-size:14px; padding:36px 0; }
.section-title { font-size:15px; font-weight:600; margin:4px 2px 12px; display:flex; align-items:center; gap:6px; }
.section-title::before { content:''; width:4px; height:16px; background:#1e6fff; border-radius:2px; }
</style>
</head>
<body>
<div class="header">
  <a class="back" href="home.html">‹ 返回</a>
  <span class="title">纳税记录开具</span>
</div>
<div class="content">
  <div class="card">
    <h3>开具申请</h3>
    <div class="field"><label>证件类型</label><select id="idType"></select></div>
    <div class="field"><label>证件号码</label><input id="idNumber" readonly></div>
    <div class="range-row">
      <div class="range-box" onclick="pickDate('start')"><small>开具年月起</small><b id="dateStart">—</b></div>
      <div class="range-box" onclick="pickDate('end')"><small>开具年月止</small><b id="dateEnd">—</b></div>
    </div>
    <div class="slider-box" id="sliderBox">
      <div class="slider-track" id="sliderTrack">请按住滑块，拖动到最右边</div>
      <div class="slider-handle" id="sliderHandle">»</div>
    </div>
    <button class="btn-primary" id="genBtn" disabled onclick="generate()">生成纳税记录</button>
  </div>

  <div class="section-title" style="margin-top:20px">开具记录</div>
  <div id="appList"></div>
</div>
<script src="tax-core.js"></script>
<script>
(function () {
  var p = TaxCore.getProfile();
  var sel = document.getElementById('idType');
  sel.innerHTML = '<option>' + (p.idType || '居民身份证') + '</option>';
  document.getElementById('idNumber').value = maskId(p.idNumber);
  var now = new Date();
  var startY = { y: now.getFullYear(), m: 1 }, endY = { y: now.getFullYear(), m: Math.min(12, now.getMonth() + 1) };
  if (endY.m < 1) { endY.y--; endY.m = 12; }
  function render() {
    document.getElementById('dateStart').textContent = startY.y + '-' + TaxCore.pad2(startY.m);
    document.getElementById('dateEnd').textContent = endY.y + '-' + TaxCore.pad2(endY.m);
  }
  window.pickDate = function (which) {
    var cur = which === 'start' ? startY : endY;
    var v = prompt('输入年月（格式 2026-03）', cur.y + '-' + TaxCore.pad2(cur.m));
    if (!v) return;
    var m = /^(\d{4})-(\d{1,2})$/.exec(v.trim());
    if (!m) { alert('格式应为 2026-03'); return; }
    var y = parseInt(m[1]), mo = parseInt(m[2]);
    if (y < 2019 || mo < 1 || mo > 12) { alert('最早 2019-01，月份 1-12'); return; }
    if (which === 'start') startY = { y: y, m: mo }; else endY = { y: y, m: mo };
    render();
  };
  function maskId(id) {
    id = String(id || '');
    if (id.length < 8) return id;
    return id.substring(0, 1) + '*'.repeat(Math.min(12, id.length - 2)) + id.substring(id.length - 1);
  }
  render();

  /* 滑块 */
  var box = document.getElementById('sliderBox'), handle = document.getElementById('sliderHandle'), track = document.getElementById('sliderTrack');
  var genBtn = document.getElementById('genBtn');
  var dragging = false, startX = 0, maxLeft = 0;
  function onDown(e) {
    if (box.classList.contains('verified')) return;
    dragging = true;
    startX = (e.touches ? e.touches[0].clientX : e.clientX) - handle.offsetLeft;
    maxLeft = box.clientWidth - handle.clientWidth - 4;
    e.preventDefault();
  }
  function onMove(e) {
    if (!dragging) return;
    var x = (e.touches ? e.touches[0].clientX : e.clientX) - startX;
    if (x < 2) x = 2; if (x > maxLeft) x = maxLeft;
    handle.style.left = x + 'px';
    if (x >= maxLeft - 2) {
      dragging = false;
      box.classList.add('verified');
      track.textContent = '验证通过';
      genBtn.disabled = false;
    }
    e.preventDefault();
  }
  function onUp() { dragging = false; }
  handle.addEventListener('touchstart', onDown, { passive: false });
  handle.addEventListener('touchmove', onMove, { passive: false });
  handle.addEventListener('touchend', onUp);
  handle.addEventListener('mousedown', onDown);
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);

  /* 生成 */
  window.generate = function () {
    if (startY.y > endY.y || (startY.y === endY.y && startY.m > endY.m)) { alert('开具年月起不能晚于年月止'); return; }
    genBtn.disabled = true;
    genBtn.textContent = '正在生成...';
    setTimeout(function () {
      // 按起止年月生成分段记录（跨年则分段）
      var issues = [];
      if (startY.y === endY.y) {
        issues.push(TaxCore.createIssue(startY.y, startY.m, endY.m));
      } else {
        for (var y = startY.y; y <= endY.y; y++) {
          var sm = (y === startY.y) ? startY.m : 1;
          var em = (y === endY.y) ? endY.m : 12;
          issues.push(TaxCore.createIssue(y, sm, em));
        }
      }
      genBtn.disabled = false;
      genBtn.textContent = '生成纳税记录';
      box.classList.remove('verified');
      track.textContent = '请按住滑块，拖动到最右边';
      handle.style.left = '2px';
      renderList();
    }, 800);
  };

  /* 列表 */
  function renderList() {
    var list = TaxCore.listIssues();
    var box2 = document.getElementById('appList');
    if (!list.length) { box2.innerHTML = '<div class="empty">暂无开具记录</div>'; return; }
    var html = '';
    list.forEach(function (it) {
      html += '<div class="app-item">' +
        '<div class="app-line"><span>申请编号</span><b>' + esc(it.id) + '</b></div>' +
        '<div class="app-line"><span>申请时间</span><b>' + esc(it.apply_time) + '</b></div>' +
        '<div class="app-line"><span>税款时期</span><b>' + esc(it.period_start) + ' 至 ' + esc(it.period_end) + '</b></div>' +
        '<div class="app-line"><span>验证码</span><b>' + esc(it.record_no) + '</b></div>' +
        '<div class="app-line"><span>状态</span><b class="app-status">' + esc(it.status) + '</b></div>' +
        '<div class="app-line"><span>开具范围</span><b>' + esc(it.scope) + '</b></div>' +
        '<div class="app-actions">' +
        '<button onclick="location.href=\'preview.html?id=' + it.id + '\'">预览</button>' +
        '<button class="save" onclick="location.href=\'preview.html?id=' + it.id + '&save=1\'">保存</button>' +
        '</div></div>';
    });
    box2.innerHTML = html;
  }
  function esc(s) {
    return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  renderList();
})();
</script>
</body>
</html>
