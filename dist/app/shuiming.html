<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>收入纳税明细 · 个人所得税</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { min-height:100%; font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif; background:#f5f6fa; color:#222; }
.header { background:#fff; display:flex; align-items:center; height:48px; padding:0 12px; border-bottom:1px solid #f0f0f0; }
.header .back { color:#4285f4; font-size:15px; text-decoration:none; }
.header .title { flex:1; text-align:center; font-size:17px; font-weight:600; margin-right:40px; }
.content { padding:14px; }
.card { background:#fff; border-radius:14px; padding:16px; margin-bottom:14px; box-shadow:0 1px 6px #0000000a; }
.card .label { font-size:14px; color:#666; margin-bottom:10px; }
.type-list { display:flex; flex-wrap:wrap; gap:10px; }
.type-item { border:1px solid #e3e6ec; border-radius:18px; padding:8px 18px; font-size:14px; color:#444; cursor:pointer; user-select:none; }
.type-item.on { background:#e8f1ff; border-color:#1e6fff; color:#1e6fff; font-weight:500; }
.year-select { display:flex; align-items:center; justify-content:space-between; min-height:44px; }
.year-select .yv { font-size:16px; font-weight:500; }
.year-select .chev { color:#999; }
.btn-primary { display:block; width:100%; height:46px; border:0; border-radius:23px; background:#1e6fff; color:#fff; font-size:16px; font-weight:500; margin-top:18px; }
.empty-tip { text-align:center; color:#999; font-size:13px; padding:10px 0 0; }
</style>
</head>
<body>
<div class="header">
  <a class="back" href="home.html">‹ 返回</a>
  <span class="title">收入纳税明细</span>
</div>
<div class="content">
  <div class="card">
    <div class="label">请选择纳税年度</div>
    <div class="year-select" id="yearRow">
      <span class="yv" id="yearShow">—</span>
      <span class="chev">›</span>
    </div>
  </div>
  <div class="card">
    <div class="label">请选择所得类型（可多选）</div>
    <div class="type-list" id="typeList"></div>
  </div>
  <button class="btn-primary" onclick="doQuery()">查 询</button>
  <div class="empty-tip" id="noData" style="display:none">该年度暂无数据，请先到「数据管理」生成</div>
</div>
<script src="tax-core.js"></script>
<script>
var TYPES = ['工资薪金','劳务报酬','稿酬','特许权使用费','其他类型','经营所得','利息、股息、红利','财产租赁','财产转让','偶然所得'];
var selected = ['工资薪金'];
var yearSel = null;

function renderTypes() {
  var box = document.getElementById('typeList');
  box.innerHTML = '';
  TYPES.forEach(function (t) {
    var el = document.createElement('div');
    el.className = 'type-item' + (selected.indexOf(t) >= 0 ? ' on' : '');
    el.textContent = t;
    el.onclick = function () {
      var i = selected.indexOf(t);
      if (i >= 0) { if (selected.length > 1) selected.splice(i, 1); }
      else selected.push(t);
      renderTypes();
    };
    box.appendChild(el);
  });
}
function initYear() {
  var years = TaxCore.listYears();
  var box = document.getElementById('yearShow');
  if (!years.length) {
    box.textContent = '暂无数据';
    document.getElementById('noData').style.display = 'block';
    yearSel = new Date().getFullYear();
    return;
  }
  // 记住上次选择
  try {
    var last = parseInt(localStorage.getItem('tax_sel_year'));
    yearSel = years.indexOf(last) >= 0 ? last : years[0];
  } catch (e) { yearSel = years[0]; }
  box.textContent = yearSel + ' 年';
  document.getElementById('noData').style.display = 'none';
}
document.getElementById('yearRow').onclick = function () {
  var years = TaxCore.listYears();
  if (!years.length) { alert('暂无数据，请先到「数据管理」生成'); return; }
  var opts = years.map(function (y) { return y + ' 年'; });
  var pick = prompt('选择纳税年度（输入年份）：\n' + opts.join(' / '), yearSel);
  var v = parseInt(pick);
  if (v && years.indexOf(v) >= 0) {
    yearSel = v;
    document.getElementById('yearShow').textContent = v + ' 年';
    try { localStorage.setItem('tax_sel_year', String(v)); } catch (e) {}
  }
};
function doQuery() {
  if (!TaxCore.getYear(yearSel)) { alert('该年度暂无数据，请先到「数据管理」生成'); return; }
  location.href = 'result.html?year=' + yearSel + '&types=' + encodeURIComponent(selected.join(','));
}
renderTypes();
initYear();
</script>
</body>
</html>
