[package]
name = "taxshell"
version = "1.0.0"
description = "个税模拟器壳（无水印无验证）"
authors = ["felix"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "taxshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
